name: Publish tested TeXScholar packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing annotated version tag, with tested package digests'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assemble the tagged source
        run: python -X utf8 scripts/build.py --output dist
      - name: Verify tested digests and publish missing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -X utf8 scripts/publish_release.py --tag "$env:RELEASE_TAG"
